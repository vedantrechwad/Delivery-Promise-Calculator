<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
            color: #222;
        }
        .container {
            max-width: 900px;
            margin: auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .header a {
            text-decoration: none;
            color: #333;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }
        .card h2 {
            margin: 0 0 10px;
            font-size: 16px;
        }
        .number {
            font-size: 32px;
            font-weight: bold;
        }
        @media (max-width: 700px) {
            .cards { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Delivery Dashboard</h1>
        <a href="/deliveries">← Delivery Management</a>
    </div>

    <div class="cards">
        <div class="card">
            <h2>Total Deliveries</h2>
            <div class="number" th:text="${total}">0</div>
        </div>

        <div class="card">
            <h2>Pending</h2>
            <div class="number" th:text="${pending}">0</div>
        </div>

        <div class="card">
            <h2>Delivered</h2>
            <div class="number" th:text="${delivered}">0</div>
        </div>
    </div>
</div>
</body>
</html>
