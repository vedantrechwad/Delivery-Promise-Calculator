<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        input, button, select { padding: 8px; margin: 4px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #f2f2f2; }
        .cards { display: flex; gap: 20px; margin: 20px 0; }
        .card { border: 1px solid #ccc; padding: 15px 25px; }
    </style>
</head>
<body>

<h1>Delivery Management</h1>
<p><a href="/">← Home</a></p>

<div class="cards">
    <div class="card">
        <strong>Total</strong><br>
        <span th:text="${total}">0</span>
    </div>
    <div class="card">
        <strong>Pending</strong><br>
        <span th:text="${pending}">0</span>
    </div>
    <div class="card">
        <strong>Delivered</strong><br>
        <span th:text="${delivered}">0</span>
    </div>
</div>

<h2>Create Delivery</h2>

<form method="post" action="/deliveries">
    <input type="text" name="customerName" placeholder="Customer Name" required>
    <input type="text" name="deliveryAddress" placeholder="Delivery Address" required>
    <input type="text" name="productName" placeholder="Product Name" required>
    <input type="number" name="deliveryDays" placeholder="Delivery Days" min="1" required>
    <button type="submit">Create Delivery</button>
</form>

<h2>Search</h2>

<form method="get" action="/deliveries">
    <input type="text" name="keyword" th:value="${keyword}"
           placeholder="Customer or product">
    <button type="submit">Search</button>
    <a href="/deliveries">Clear</a>
</form>

<h2>Delivery Records</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Customer</th>
        <th>Address</th>
        <th>Product</th>
        <th>Delivery Days</th>
        <th>Promised Date</th>
        <th>Status</th>
        <th>Update Status</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="d : ${deliveries}">
        <td th:text="${d.id}"></td>
        <td th:text="${d.customerName}"></td>
        <td th:text="${d.deliveryAddress}"></td>
        <td th:text="${d.productName}"></td>
        <td th:text="${d.deliveryDays}"></td>
        <td th:text="${d.promisedDate}"></td>
        <td th:text="${d.status}"></td>
        <td>
            <form th:action="@{/deliveries/{id}/status(id=${d.id})}" method="post">
                <select name="status">
                    <option value="PENDING">PENDING</option>
                    <option value="PROCESSING">PROCESSING</option>
                    <option value="SHIPPED">SHIPPED</option>
                    <option value="DELIVERED">DELIVERED</option>
                    <option value="CANCELLED">CANCELLED</option>
                </select>
                <button type="submit">Update</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(deliveries)}">
        <td colspan="8">No delivery records found.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
