<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar(activeTab)" class="navbar">
    <div class="navbar-inner">
        <a href="/" class="brand">
            <div class="brand-icon">📦</div>
            <span>PromiseFlow</span>
        </a>

        <ul class="nav-links">
            <li>
                <a href="/deliveries" class="nav-link" th:classappend="${activeTab == 'deliveries'} ? 'active' : ''">
                    <span>📋</span> Deliveries
                </a>
            </li>
            <li>
                <a href="/dashboard" class="nav-link" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
                    <span>📊</span> Dashboard
                </a>
            </li>
            <li>
                <a href="/track" class="nav-link" th:classappend="${activeTab == 'track'} ? 'active' : ''">
                    <span>🔍</span> Track Parcel
                </a>
            </li>
        </ul>

        <div class="nav-actions">
            <!-- Role Persona Switcher -->
            <div class="user-badge">
                <span th:text="${avatar != null ? avatar : '👤'}">👤</span>
                <span th:text="${displayName != null ? displayName : 'Guest'}">Guest</span>
                <span class="role-pill"
                      th:classappend="${role == 'ADMIN'} ? 'admin' : (${role == 'OPERATIONS'} ? 'operations' : 'customer')"
                      th:text="${role != null ? role : 'CUSTOMER'}">
                    CUSTOMER
                </span>
            </div>

            <div style="display: flex; gap: 4px;">
                <a th:href="@{/login(role='admin')}" title="Switch to Admin" class="btn btn-sm btn-secondary" style="padding: 4px 8px; font-size: 11px;">Admin</a>
                <a th:href="@{/login(role='operator')}" title="Switch to Operations" class="btn btn-sm btn-secondary" style="padding: 4px 8px; font-size: 11px;">Ops</a>
                <a th:href="@{/login(role='customer')}" title="Switch to Customer" class="btn btn-sm btn-secondary" style="padding: 4px 8px; font-size: 11px;">Customer</a>
            </div>

            <!-- Login / Logout Link -->
            <a th:if="${user == null or user == 'guest'}" href="/login" class="btn btn-sm btn-primary">Sign In</a>
            <a th:if="${user != null and user != 'guest'}" href="/logout" class="btn btn-sm btn-secondary" title="Sign Out">Logout</a>

            <!-- Theme Toggle -->
            <button type="button" class="theme-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌓</button>
        </div>
    </div>

    <script>
        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            if (current === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
        }
        initTheme();
    </script>
</nav>
</body>
</html>
